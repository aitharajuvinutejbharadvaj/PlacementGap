services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: placementgap
      POSTGRES_USER: placementgap
      POSTGRES_PASSWORD: placementgap
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementgap"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment: ["DATABASE_URL=postgresql://placementgap:placementgap@postgres:5432/placementgap", "PLACEMENTGAP_FIXTURES=1"]
    volumes: ["appruns:/app/outputs/app"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: ./web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
volumes:
  pgdata:
  appruns:
