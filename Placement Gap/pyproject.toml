[project]
name = "placementgap"
version = "0.1.0"
description = "Evidence-grounded deterministic placement gap planning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "langgraph>=0.2", "litellm>=1.40", "fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "psycopg[binary,pool]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3", "pypdf>=4.3", "python-docx>=1.1", "PyYAML>=6.0", "opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26", "reportlab>=4.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-reportlab>=4.2"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
python_version = "3.11"
[tool.setuptools.packages.find]
include = ["agent*", "ontology*", "memory*", "evals*", "api*"]
exclude = ["tests*", "web*", "outputs*", "work*"]
